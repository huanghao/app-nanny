<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>nanny</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23252526'/><polyline points='7,25 7,7 20,25 20,7' fill='none' stroke='%234ec9b0' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'/></svg>">
  <style>
    :root {
      /* UI uses the system font; monospace is reserved for logs/config/metrics */
      --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Segoe UI", Roboto, sans-serif;
      --font-mono: "SF Mono", Menlo, Consolas, monospace;
    }
    body { font-family: var(--font-ui); background: #1a1a1a; color: #d4d4d4; margin: 0; padding: 0; }
    header { background: #252526; padding: 12px 20px; border-bottom: 1px solid #3c3c3c; display: flex; align-items: center; gap: 12px; }
    header h1 { margin: 0; font-size: 16px; color: #9cdcfe; }
    #status-dot { width: 8px; height: 8px; border-radius: 50%; background: #4ec9b0; display: inline-block; }
    #daemon-version { color: #585858; font-size: 11px; }
    .main { padding: 10px 14px; }
    .toolbar { min-height: 32px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
    #filter { min-width: 260px; height: 28px; border: 1px solid #3c3c3c; background: #1f2022; color: #d4d4d4; border-radius: 4px; padding: 0 9px; font-family: var(--font-ui); font-size: 13px; }
    #overview { margin-left: auto; display: flex; gap: 12px; color: #858585; font-size: 12px; white-space: nowrap; }
    #overview b { color: #d4d4d4; font-weight: normal; }
    #project-table { width: 100%; border-collapse: collapse; font-size: 13px; table-layout: fixed; font-variant-numeric: tabular-nums; }
    #project-table th { text-align: left; padding: 8px 12px; background: #252526; color: #858585; font-weight: normal; border-bottom: 1px solid #3c3c3c; position: sticky; top: 0; z-index: 1; }
    #project-table td { padding: 6px 12px; border-bottom: 1px solid #2d2d2d; vertical-align: middle; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #project-table tbody tr:hover td { background: #2a2a2a; }
    #project-table tbody tr.active-log td { background: #1f2d2d; }
    .empty { padding: 24px 12px; color: #585858; text-align: center; border: 1px solid #2d2d2d; border-radius: 6px; }
    .project-row { cursor: pointer; background: #26272b; }
    /* 2px wins over the 1px row borders in the collapsed-border model,
       giving each project group a clear top separator */
    .project-row td { border-top: 2px solid #3c3c3c; }
    .project-row.open td { background: #26272b; }
    .project-row.active-log td:first-child { box-shadow: inset 3px 0 0 #4ec9b0; }
    .service-row { cursor: pointer; background: #1a1a1a; }
    .service-row td:first-child { padding-left: 28px; color: #a3a3a3; }
    .service-row td:first-child::before { content: '└ '; color: #4a4a4a; }
    .service-row .proc-default { color: #585858; }
    .chevron { display: inline-block; width: 14px; color: #858585; line-height: 1; }
    .project-title { display: flex; align-items: center; gap: 6px; min-width: 0; color: #f0f0f0; font-weight: 600; }
    .project-title .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .copy-cwd { color: #858585; }
    .copy-cwd.copied { color: #4ec9b0; }
    .health { color: #858585; }
    .health .running { color: #4ec9b0; }
    .health .stopped { color: #585858; }
    .health .crashed { color: #f48771; }
    .ports { min-width: 0; display: flex; gap: 5px; flex-wrap: nowrap; align-items: center; overflow: hidden; }
    .running { color: #4ec9b0; }
    .stopped { color: #585858; }
    .crashed { color: #f48771; }
    .btn { background: #3c3c3c; border: none; color: #d4d4d4; padding: 3px 10px; cursor: pointer; border-radius: 3px; font-family: var(--font-ui); font-size: 12px; margin: 0 2px; }
    .btn:hover { background: #505050; }
    a.port-link { color: #4ec9b0; text-decoration: none; }
    a.port-link:hover { text-decoration: underline; color: #7de8d0; }
    .port-dim { color: #484848; }
    .port-more { color: #858585; }
    .err-badge { display: inline-block; background: #c0392b; color: #fff; font-size: 10px; font-weight: bold; padding: 1px 6px; border-radius: 8px; margin-left: 6px; cursor: pointer; vertical-align: middle; line-height: 16px; }
    .err-badge:hover { background: #e74c3c; }

    /* Log panel */
    #log-panel { position: fixed; bottom: 0; left: 0; right: 0; background: #1e1e1e; border-top: 1px solid #3c3c3c; display: flex; flex-direction: column; }
    #log-resize { height: 6px; cursor: row-resize; background: #2d2d2d; flex-shrink: 0; position: relative; }
    #log-resize::after { content: ''; position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); width: 32px; height: 2px; border-radius: 1px; background: #555; }
    #log-resize:hover, #log-resize.dragging { background: #1e3a3a; }
    #log-resize:hover::after, #log-resize.dragging::after { background: #4ec9b0; }
    #log-header { background: #252526; padding: 6px 12px; font-size: 12px; color: #858585; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
    #log-body { flex: 1; overflow-y: auto; padding: 8px 12px 2em; font-family: var(--font-mono); font-size: 12px; line-height: 1.6; min-height: 0; }
    #log-body .err { color: #f48771; }
    #log-body .sep { color: #4ec9b0; opacity: 0.5; text-align: center; margin: 6px 0; letter-spacing: 1px; }
    /* Config modal */
    #cfg-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 100; align-items: center; justify-content: center; }
    #cfg-modal.open { display: flex; }
    #cfg-box { background: #252526; border: 1px solid #3c3c3c; border-radius: 6px; width: min(680px,90vw); max-height: 80vh; display: flex; flex-direction: column; }
    #cfg-title { padding: 12px 16px; font-size: 13px; color: #9cdcfe; border-bottom: 1px solid #3c3c3c; display: flex; justify-content: space-between; align-items: center; }
    #cfg-title button { background: none; border: none; color: #858585; font-size: 16px; cursor: pointer; padding: 0 4px; }
    #cfg-title button:hover { color: #d4d4d4; }
    #cfg-meta { padding: 5px 16px 8px; font-size: 11px; color: #585858; display: flex; gap: 16px; border-bottom: 1px solid #2d2d2d; }
    #cfg-meta .stale { color: #c0960a; }
    #cfg-meta button { background: none; border: none; color: #4ec9b0; font-size: 11px; cursor: pointer; padding: 0; text-decoration: underline; }
    #cfg-pre { flex: 1; overflow-y: auto; margin: 0; padding: 16px; font-family: var(--font-mono); font-size: 12px; line-height: 1.7; white-space: pre; color: #d4d4d4; background: #1a1a1a; border-radius: 0 0 6px 6px; }
    @media (max-width: 980px) {
      #overview { width: 100%; margin-left: 0; }
      #project-table th:nth-child(5), #project-table th:nth-child(8),
      #project-table td:nth-child(5), #project-table td:nth-child(8) { display: none; }
    }
    @media (max-width: 700px) {
      .main { padding-left: 10px; padding-right: 10px; }
      #filter { min-width: 100%; }
      #project-table th:nth-child(4), #project-table th:nth-child(5), #project-table th:nth-child(6), #project-table th:nth-child(8),
      #project-table td:nth-child(4), #project-table td:nth-child(5), #project-table td:nth-child(6), #project-table td:nth-child(8) { display: none; }
    }
  </style>
</head>
<body>
<header>
  <span id="status-dot"></span>
  <h1>nanny</h1>
  <span id="daemon-version"></span>
  <span id="daemon-status" style="color:#858585;font-size:12px">loading...</span>
</header>
<div class="main" id="main">
  <div class="toolbar">
    <input id="filter" placeholder="filter project / process / port" autocomplete="off">
    <button id="refresh-btn" class="btn" title="refresh status">refresh</button>
    <div id="overview"></div>
  </div>
  <table id="project-table">
    <colgroup>
      <col style="width:23%">
      <col style="width:12%">
      <col style="width:14%">
      <col style="width:18%">
      <col style="width:8%">
      <col style="width:10%">
      <col style="width:8%">
      <col style="width:8%">
      <col style="width:7%">
      <col style="width:11%">
    </colgroup>
    <thead><tr>
      <th>PROJECT / PROCESS</th><th>ACTIONS</th><th>PORTS</th><th>STATUS</th>
      <th>PID</th><th>UPTIME</th><th>MEM</th><th>CPU</th><th>LAST</th>
    </tr></thead>
    <tbody id="project-body"></tbody>
  </table>
</div>
<div id="cfg-modal" onclick="if(event.target===this)closeCfg()">
  <div id="cfg-box">
    <div id="cfg-title">
      <span id="cfg-name"></span>
      <button onclick="closeCfg()" title="close">✕</button>
    </div>
    <div id="cfg-meta"></div>
    <pre id="cfg-pre"></pre>
  </div>
</div>
<div id="log-panel">
  <div id="log-resize"></div>
  <div id="log-header">
    <span id="log-title">logs — click a service row</span>
    <span><button class="btn" onclick="clearLog()">clear</button></span>
  </div>
  <div id="log-body"></div>
</div>
<script>
let eventSource = null;
let activeKey   = null;
let lastPSLoad  = 0;

// ── Error acknowledgement ────────────────────────────────────────────────────
const ACK_KEY = 'nanny-ack';
const EXPANDED_KEY = 'nanny-expanded-projects';

let latestProcesses = [];

function getAckTime(key) {
  try { return JSON.parse(localStorage.getItem(ACK_KEY) || '{}')[key] || ''; }
  catch { return ''; }
}

function setAckTime(key) {
  try {
    const map = JSON.parse(localStorage.getItem(ACK_KEY) || '{}');
    map[key] = new Date().toISOString();
    localStorage.setItem(ACK_KEY, JSON.stringify(map));
  } catch {}
}

function getExpandedProjects() {
  try { return new Set(JSON.parse(localStorage.getItem(EXPANDED_KEY) || '[]')); }
  catch { return new Set(); }
}

function setExpandedProjects(projects) {
  try { localStorage.setItem(EXPANDED_KEY, JSON.stringify([...projects])); }
  catch {}
}

// ── Log panel resize ─────────────────────────────────────────────────────────
const LS_HEIGHT = 'nanny-log-height';
const DEFAULT_H = 380;
const MIN_H = 80;
const MAX_H = () => Math.floor(window.innerHeight * 0.85);

function applyH(h) {
  h = Math.max(MIN_H, Math.min(MAX_H(), h));
  document.getElementById('log-panel').style.height = h + 'px';
  document.getElementById('main').style.paddingBottom = (h + 8) + 'px';
  return h;
}

(function setupResize() {
  const saved = parseInt(localStorage.getItem(LS_HEIGHT), 10);
  applyH(saved > 0 ? saved : DEFAULT_H);

  const handle = document.getElementById('log-resize');
  let drag = false, startY = 0, startH = 0;

  handle.addEventListener('mousedown', e => {
    drag = true; startY = e.clientY;
    startH = document.getElementById('log-panel').offsetHeight;
    handle.classList.add('dragging');
    document.body.style.cursor = 'row-resize';
    document.body.style.userSelect = 'none';
    e.preventDefault();
  });
  document.addEventListener('mousemove', e => {
    if (!drag) return;
    applyH(startH + (startY - e.clientY));
  });
  document.addEventListener('mouseup', () => {
    if (!drag) return;
    drag = false;
    handle.classList.remove('dragging');
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
    localStorage.setItem(LS_HEIGHT, document.getElementById('log-panel').offsetHeight);
  });
})();

// ── Daemon version ───────────────────────────────────────────────────────────
async function loadVersion() {
  try {
    const r = await fetch('/api/v1/version');
    const d = await r.json();
    document.getElementById('daemon-version').textContent = 'v' + d.version;
  } catch(e) {}
}
loadVersion();

// ── Helpers ──────────────────────────────────────────────────────────────────
function relTime(iso) {
  if (!iso) return '—';
  const s = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 5)    return 'now';
  if (s < 60)   return s + 's';
  if (s < 3600) return Math.floor(s / 60) + 'm';
  if (s < 86400) return Math.floor(s / 3600) + 'h';
  return Math.floor(s / 86400) + 'd';
}

function shortenPath(p) {
  // Replace home directory prefix with ~
  const home = location.hostname === 'localhost' ? null : null; // can't know home in browser
  // Just show last 3 path segments
  const parts = p.replace(/\\/g, '/').split('/').filter(Boolean);
  if (parts.length <= 3) return p;
  return '…/' + parts.slice(-3).join('/');
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, ch => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  })[ch]);
}

function portsHTML(p) {
  const actual = p.actual_ports || [];
  const declared = p.declared_port || 0;
  if (actual.length > 0) {
    return actual.map(port =>
      `<a class="port-link" href="http://localhost:${port}" target="_blank" onclick="event.stopPropagation()">${port}</a>`
    ).join('&nbsp;');
  }
  if (declared > 0) {
    if (p.status === 'running') {
      return `<a class="port-link" href="http://localhost:${declared}" target="_blank" onclick="event.stopPropagation()">${declared}</a>`
           + `&nbsp;<span class="port-dim">(starting)</span>`;
    }
    return `<span class="port-dim">${declared}</span>`;
  }
  return '<span class="port-dim">—</span>';
}

function projectPortsHTML(project) {
  const ports = [];
  for (const p of project.processes) {
    const actual = p.actual_ports || [];
    if (actual.length > 0) {
      for (const port of actual) ports.push({ port, active: true });
    } else if (p.declared_port > 0) {
      ports.push({ port: p.declared_port, active: p.status === 'running' });
    }
  }

  const unique = [];
  const seen = new Set();
  for (const item of ports) {
    if (seen.has(item.port)) continue;
    seen.add(item.port);
    unique.push(item);
  }

  if (unique.length === 0) return '<span class="port-dim">—</span>';

  const visible = unique.slice(0, 4).map(item => {
    if (item.active) {
      return `<a class="port-link" href="http://localhost:${item.port}" target="_blank" onclick="event.stopPropagation()">${item.port}</a>`;
    }
    return `<span class="port-dim">${item.port}</span>`;
  }).join('&nbsp;');

  const more = unique.length > 4 ? ` <span class="port-more">+${unique.length - 4}</span>` : '';
  return visible + more;
}

function uptimeSeconds(uptime) {
  if (!uptime) return 0;
  let total = 0;
  const re = /(\d+)([hms])/g;
  let match;
  while ((match = re.exec(uptime)) !== null) {
    const n = Number(match[1]);
    if (match[2] === 'h') total += n * 3600;
    if (match[2] === 'm') total += n * 60;
    if (match[2] === 's') total += n;
  }
  return total;
}

function actionsHTML(key) {
  const project = key.split('/')[0];
  return `<button class="btn service-action" data-key="${esc(key)}" data-action="start" title="start">&#9654;</button>`
       + `<button class="btn service-action" data-key="${esc(key)}" data-action="stop" title="stop">&#9632;</button>`
       + `<button class="btn service-action" data-key="${esc(key)}" data-action="restart" title="restart">&#8634;</button>`
       + `<button class="btn config-action" data-project="${esc(project)}" title="view app-nanny.toml">&#9881;</button>`;
}

async function copyText(text, btn) {
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
  }
  if (!btn) return;
  const old = btn.textContent;
  btn.textContent = '✓';
  btn.classList.add('copied');
  setTimeout(() => {
    btn.textContent = old;
    btn.classList.remove('copied');
  }, 900);
}

let cfgData = null;
let cfgShowingDisk = false;

async function showCfg(project) {
  const r = await fetch('/api/v1/config/' + project);
  cfgData = await r.json();
  cfgShowingDisk = false;
  renderCfg(project);
  document.getElementById('cfg-modal').classList.add('open');
}

function renderCfg(project) {
  const d = cfgData;
  // Title
  const label = cfgShowingDisk ? '磁盘版本' : (d.active ? '运行中' : 'app-nanny.toml');
  document.getElementById('cfg-name').textContent = project + '  —  ' + label;
  // Content
  document.getElementById('cfg-pre').textContent = cfgShowingDisk ? d.disk : (d.active || d.disk);
  // Meta row: show times, highlight disk_mtime if stale
  const meta = document.getElementById('cfg-meta');
  let html = '';
  if (d.loaded_at)  html += `<span>加载于 ${d.loaded_at}</span>`;
  if (d.disk_mtime) {
    const cls = d.stale ? 'stale' : '';
    html += `<span class="${cls}">磁盘修改 ${d.disk_mtime}</span>`;
  }
  if (d.stale) {
    const action = cfgShowingDisk ? '查看运行中' : '查看磁盘版本';
    html += `<button onclick="toggleCfgView()">${action}</button>`;
  }
  meta.innerHTML = html;
}

function toggleCfgView() {
  if (!cfgData) return;
  cfgShowingDisk = !cfgShowingDisk;
  const project = document.getElementById('cfg-name').textContent.split('  —  ')[0];
  renderCfg(project);
}

function closeCfg() {
  document.getElementById('cfg-modal').classList.remove('open');
  cfgData = null;
  cfgShowingDisk = false;
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeCfg(); });

function serviceKey(p) {
  return p.process ? `${p.project}/${p.process}` : p.project;
}

function groupProcesses(processes) {
  const projects = new Map();
  for (const p of processes) {
    if (!projects.has(p.project)) {
      projects.set(p.project, { name: p.project, processes: [] });
    }
    projects.get(p.project).processes.push(p);
  }
  const groups = [...projects.values()];
  groups.sort((a, b) => a.name.localeCompare(b.name));
  for (const group of groups) {
    group.processes.sort((a, b) => (a.process || '').localeCompare(b.process || ''));
  }
  return groups;
}

function projectSummary(project) {
  const summary = {
    running: 0,
    stopped: 0,
    crashed: 0,
    mem: 0,
    cpu: 0,
    newestLog: '',
    workDir: '',
    uptime: '',
    uptimeSec: 0,
    hasActiveLog: false,
    hasNewErr: false,
  };

  for (const p of project.processes) {
    const key = serviceKey(p);
    if (p.status === 'running') summary.running++;
    else if (p.status === 'crashed') summary.crashed++;
    else summary.stopped++;

    if (p.mem_mb > 0) summary.mem += p.mem_mb;
    if (p.cpu_percent > 0) summary.cpu += p.cpu_percent;
    if (p.work_dir && !summary.workDir) summary.workDir = p.work_dir;
    if (uptimeSeconds(p.uptime) > summary.uptimeSec) {
      summary.uptime = p.uptime;
      summary.uptimeSec = uptimeSeconds(p.uptime);
    }
    if (p.last_log_time && (!summary.newestLog || new Date(p.last_log_time) > new Date(summary.newestLog))) {
      summary.newestLog = p.last_log_time;
    }
    if (key === activeKey) summary.hasActiveLog = true;

    const ackTime = getAckTime(key);
    if (p.last_error_time && p.error_count > 0 && new Date(p.last_error_time) > new Date(ackTime || 0)) {
      summary.hasNewErr = true;
    }
  }
  return summary;
}

function healthHTML(summary) {
  const parts = [];
  parts.push(`<span>${summary.total} services</span>`);
  if (summary.running > 0) parts.push(`<span class="running">${summary.running} running</span>`);
  if (summary.crashed > 0) parts.push(`<span class="crashed">${summary.crashed} crashed</span>`);
  if (summary.stopped > 0) parts.push(`<span class="stopped">${summary.stopped} stopped</span>`);
  if (summary.hasNewErr) parts.push(`<span class="err-badge" title="new errors">!</span>`);
  return parts.join(' · ');
}

function processRowHTML(p) {
  const key = serviceKey(p);
  const mem = p.mem_mb > 0 ? p.mem_mb.toFixed(0) + 'M' : '—';
  const cpu = p.cpu_percent > 0 ? p.cpu_percent.toFixed(0) + '%' : '—';
  const ackTime = getAckTime(key);
  const hasNewErr = p.last_error_time && p.error_count > 0
                 && new Date(p.last_error_time) > new Date(ackTime || 0);
  const badgeHTML = hasNewErr
    ? ` <span class="err-badge ack-err" data-key="${esc(key)}" title="点击确认">${p.error_count}</span>`
    : '';

  return `<tr class="service-row${key === activeKey ? ' active-log' : ''}" data-key="${esc(key)}">
    <td>${p.process ? esc(p.process) : '<span class="proc-default">default</span>'}</td>
    <td>${actionsHTML(key)}</td>
    <td>${portsHTML(p)}</td>
    <td class="${esc(p.status)}">${esc(p.status)}${badgeHTML}</td>
    <td>${p.pid || '—'}</td>
    <td>${esc(p.uptime || '—')}</td>
    <td>${mem}</td>
    <td>${cpu}</td>
    <td>${relTime(p.last_log_time)}</td>
  </tr>`;
}

function projectHTML(project, expandedProjects) {
  const summary = projectSummary(project);
  const open = expandedProjects.has(project.name);
  const count = project.processes.length;
  summary.total = count;
  const mem = summary.mem > 0 ? summary.mem.toFixed(0) + 'M' : '—';
  const cpu = summary.cpu > 0 ? summary.cpu.toFixed(0) + '%' : '—';
  const activeClass = summary.hasActiveLog ? ' active-log' : '';
  const chevron = open ? '▾' : '▸';

  const projectRow = `<tr class="project-row${open ? ' open' : ''}${activeClass}" data-project="${esc(project.name)}" aria-expanded="${open}">
    <td><span class="project-title">
      <span class="chevron">${chevron}</span>
      <span class="name">${esc(project.name)}</span>
    </span></td>
    <td>${summary.workDir ? `<button class="btn copy-cwd" data-path="${esc(summary.workDir)}" title="copy workspace path">cwd</button>` : ''}</td>
    <td><span class="ports">${projectPortsHTML(project)}</span></td>
    <td><span class="health">${healthHTML(summary)}</span></td>
    <td>—</td>
    <td>${esc(summary.uptime || '—')}</td>
    <td>${mem}</td>
    <td>${cpu}</td>
    <td>${relTime(summary.newestLog)}</td>
  </tr>`;
  return projectRow + (open ? project.processes.map(processRowHTML).join('') : '');
}

function processMatchesFilter(p, filter) {
  if (!filter) return true;
  const fields = [
    p.project,
    p.process || 'default',
    p.status,
    p.work_dir || '',
    String(p.declared_port || ''),
    ...(p.actual_ports || []).map(String),
  ];
  return fields.some(field => field.toLowerCase().includes(filter));
}

function renderProjects(processes) {
  const filter = document.getElementById('filter').value.trim().toLowerCase();
  const filtered = processes.filter(p => processMatchesFilter(p, filter));
  const projects = groupProcesses(filtered);
  const expandedProjects = getExpandedProjects();
  const tbody = document.getElementById('project-body');

  if (projects.length === 0) {
    tbody.innerHTML = '<tr><td colspan="9"><div class="empty">no services</div></td></tr>';
  } else {
    tbody.innerHTML = projects.map(project => projectHTML(project, expandedProjects)).join('');
  }

  const issueCount = processes.filter(p => p.status === 'crashed' || (p.error_count > 0 && p.last_error_time)).length;
  document.getElementById('overview').innerHTML =
    `<span><b>${groupProcesses(processes).length}</b> projects</span>` +
    `<span><b>${processes.length}</b> daemons</span>` +
    `<span><b>${issueCount}</b> issues</span>`;

  bindProjectEvents();
}

function bindProjectEvents() {
  document.querySelectorAll('.project-row').forEach(row => {
    row.addEventListener('click', event => {
      if (event.target.closest('a')) return;
      if (event.target.closest('button')) return;
      const name = row.dataset.project;
      const expandedProjects = getExpandedProjects();
      const open = !expandedProjects.has(name);
      if (open) expandedProjects.add(name);
      else expandedProjects.delete(name);
      setExpandedProjects(expandedProjects);
      renderProjects(latestProcesses);
    });
  });

  document.querySelectorAll('.service-row[data-key]').forEach(row => {
    row.addEventListener('click', () => streamLogs(row.dataset.key));
  });

  document.querySelectorAll('.service-action').forEach(btn => {
    btn.addEventListener('click', event => {
      event.stopPropagation();
      doAction(btn.dataset.key, btn.dataset.action);
    });
  });

  document.querySelectorAll('.copy-cwd').forEach(btn => {
    btn.addEventListener('click', event => {
      event.stopPropagation();
      copyText(btn.dataset.path, btn);
    });
  });

  document.querySelectorAll('.config-action').forEach(btn => {
    btn.addEventListener('click', event => {
      event.stopPropagation();
      showCfg(btn.dataset.project);
    });
  });

  document.querySelectorAll('.ack-err').forEach(badge => {
    badge.addEventListener('click', event => {
      event.stopPropagation();
      ackErr(badge.dataset.key);
    });
  });
}

// ── Project list ─────────────────────────────────────────────────────────────
async function loadPS() {
  try {
    const r = await fetch('/api/v1/ps');
    const data = await r.json();
    const processes = data.processes || [];

    processes.sort((a, b) => {
      const ka = a.project + '\0' + (a.process || '');
      const kb = b.project + '\0' + (b.process || '');
      return ka < kb ? -1 : ka > kb ? 1 : 0;
    });

    latestProcesses = processes;
    lastPSLoad = Date.now();
    renderProjects(latestProcesses);

    document.getElementById('daemon-status').textContent = 'daemon: running';
    document.getElementById('status-dot').style.background = '#4ec9b0';
  } catch(e) {
    document.getElementById('daemon-status').textContent = 'daemon: error';
    document.getElementById('status-dot').style.background = '#f48771';
  }
}

function ackErr(key) {
  setAckTime(key);
  // Re-render immediately without waiting for the 3s poll
  loadPS();
}

async function doAction(key, act) {
  const parts = key.split('/');
  const url = parts.length === 2
    ? `/api/v1/${parts[0]}/${parts[1]}/${act}`
    : `/api/v1/${key}/${act}`;
  await fetch(url, { method: 'POST' });
  setTimeout(loadPS, 400);
}

function streamLogs(key) {
  if (eventSource) eventSource.close();
  activeKey = key;
  setAckTime(key);

  document.getElementById('log-title').textContent = 'logs — ' + key;
  const logBody = document.getElementById('log-body');
  logBody.innerHTML = '';

  renderProjects(latestProcesses);

  const sseKey = key.replace('/', '-');
  eventSource = new EventSource('/api/v1/logs/' + sseKey + '/stream');
  eventSource.onmessage = e => {
    const line = document.createElement('div');
    if (e.data.includes('──────────'))         line.className = 'sep';
    else if (/\b5\d{2}\b|Error:|panic:|FATAL/i.test(e.data)) line.className = 'err';
    line.textContent = e.data;
    logBody.appendChild(line);
    logBody.scrollTop = logBody.scrollHeight;
  };
}

function clearLog() {
  document.getElementById('log-body').innerHTML = '';
}

document.getElementById('filter').addEventListener('input', () => renderProjects(latestProcesses));
document.getElementById('refresh-btn').addEventListener('click', () => loadPS());
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && Date.now() - lastPSLoad > 30000) loadPS();
});
window.addEventListener('focus', () => {
  if (Date.now() - lastPSLoad > 30000) loadPS();
});
loadPS();
</script>
</body>
</html>
