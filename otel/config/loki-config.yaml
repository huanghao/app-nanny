# Base config extracted from grafana/otel-lgtm:v0.31.0's /otel-lgtm/loki-config.yaml,
# plus a compactor + retention_period block (absent upstream — Loki keeps chunks
# forever without it). Bind-mounted over the image's own copy by run.sh so a
# fresh `docker run` on this machine always gets bounded local retention.
# Keep the base section in sync when bumping LOKI_VERSION in run.sh / the image.
auth_enabled: false

server:
  http_listen_port: 3100

common:
  instance_addr: 127.0.0.1
  path_prefix: /data/loki
  storage:
    filesystem:
      chunks_directory: /data/loki/chunks
      rules_directory: /data/loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

ruler:
  alertmanager_url: http://127.0.0.1:9093

pattern_ingester:
  lifecycler:
    min_ready_duration: 1s

ingester:
  lifecycler:
    min_ready_duration: 1s

frontend:
  scheduler_dns_lookup_period: 1s
  address: 127.0.0.1

query_scheduler:
  use_scheduler_ring: false

# --- added locally, not part of the upstream image config ---
compactor:
  working_directory: /data/loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  delete_request_store: filesystem

limits_config:
  retention_period: 336h # 14d
  deletion_mode: filter-and-delete # lets /loki/api/v1/delete selectively purge one service's logs
